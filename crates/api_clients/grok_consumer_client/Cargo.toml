[package]
name = "grok_consumer_client"
edition = "2024"
version = "0.0.1"
publish = false

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-build-acceleration"]

[lib]
name = "grok_consumer_client"
path = "src/lib.rs"

# Live statsig harvester (tool 2). Launches a real WebView, so it is gated
# behind the `webview-harvest` feature that pulls in wry/tao.
[[bin]]
name = "harvest_statsig"
path = "src/bin/harvest_statsig.rs"
required-features = ["webview-harvest"]

[features]
# Pull in the WebView stack (wry/tao) for the live statsig harvester. Off by
# default so ordinary library builds stay lean.
webview-harvest = ["dep:wry", "dep:tao", "dep:env_logger"]

[dependencies]
# Workspace hack (faster compile times)
workspace-build-acceleration.workspace = true

# Internal
cloudflare_errors.workspace = true
cloudflare_mitigation.workspace = true
errors.workspace = true
grok_consumer_statsig.workspace = true

# Harvest: serialize the statsig cache to statsig.toml.
toml.workspace = true

# Harvest (live): only compiled with `--features webview-harvest`.
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }
env_logger = { workspace = true, optional = true }

# External
anyhow.workspace = true
base64.workspace = true
bstr.workspace = true
byteorder.workspace = true
chrono.workspace = true
futures.workspace = true
log.workspace = true
once_cell.workspace = true
regex.workspace = true
scraper = "0.24.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["full"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
wreq-util.workspace = true
wreq.workspace = true

[dev-dependencies]
filesys.workspace = true
test_data.workspace = true
test_utils.workspace = true
log4rs = "1.4.0"
env_logger.workspace = true
env.workspace = true
chrono.workspace = true

